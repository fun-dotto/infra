name: Digger

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/cloudflare/**"
      - "terraform/google/**"
      - "digger.yml"
    types:
      - closed
      - opened
      - ready_for_review
      - reopened
      - synchronize
  issue_comment:
    types:
      - created
  workflow_dispatch:

concurrency:
  group: digger-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  id-token: write
  issues: read
  pull-requests: write
  statuses: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKLOAD_IDENTITY_PROVIDER: "projects/107577467292/locations/global/workloadIdentityPools/dotto/providers/github"
  DIGGER_LOCK_BUCKET: "swift2023groupc-tfstate"

jobs:
  digger:
    name: Digger
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'digger')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Digger の checkout を無効にしているため、issue_comment でも Pull Request のマージ結果を取得する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.ref }}

      - name: Verify PR satisfies branch rules before apply
        if: >-
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, 'digger apply')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          merge_state="$(gh pr view "$PR_NUMBER" --json mergeStateStatus --jq '.mergeStateStatus')"

          # 前回の apply 失敗で digger/apply が fail のまま残ると UNSTABLE になり再 apply できなくなるため、それ以外のチェックがすべて通っていれば許可する
          if [[ "$merge_state" == "UNSTABLE" ]]; then
            unfinished="$(gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '
              [.statusCheckRollup[]
                | select((.context // .name) != "digger/apply")
                | select(((.conclusion // .state) | IN("SUCCESS", "SKIPPED", "NEUTRAL")) | not)]
              | length')"

            if [[ "$unfinished" == "0" ]]; then
              merge_state="CLEAN"
            fi
          fi

          if [[ "$merge_state" != "CLEAN" ]]; then
            echo "::error::PR does not satisfy branch rules: $merge_state"
            exit 1
          fi

      # Digger Action の認証は Service Account を必須とするため、自前のステップで認証する
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Run Digger
        uses: diggerhq/digger@853f6abf3f7ad9d2fa20b8956e5a758441ddca1e # v0.6.154
        with:
          cache-dependencies: true
          configure-checkout: false
          digger-version: v0.6.147
          google-lock-bucket: ${{ env.DIGGER_LOCK_BUCKET }}
          no-backend: true
          post-plans-as-one-comment: true
          reporting-strategy: latest_run_comment
          setup-google-cloud: false
          setup-terraform: true
          terraform-version: 1.15.5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_github_identity_provider_client_secret: ${{ secrets.CLOUDFLARE_GITHUB_IDP_CLIENT_SECRET }}
          GITHUB_CONTEXT: ${{ toJson(github) }}
          GITHUB_TOKEN: ${{ github.token }}
          LOCK_PROVIDER: gcp
