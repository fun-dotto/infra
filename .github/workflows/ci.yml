name: CI

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          github_token: ${{ github.token }}
          cache: true
      - name: terraform fmt -check
        run: terraform fmt -check -recursive terraform

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          github_token: ${{ github.token }}
          cache: true
      - name: terraform validate
        run: |
          find terraform -name versions.tf -not -path '*/_shared/*' -print0 |
            while IFS= read -r -d '' versions_file; do
              directory="$(dirname "$versions_file")"
              terraform -chdir="$directory" init -backend=false
              terraform -chdir="$directory" validate
            done
