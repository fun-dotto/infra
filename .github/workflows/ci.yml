name: CI

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          github_token: ${{ github.token }}
          cache: true
      - name: terraform fmt -check
        run: terraform fmt -check -recursive terraform

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          github_token: ${{ github.token }}
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-providers-${{ runner.os }}-
      - name: terraform validate
        run: |
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"

          mapfile -d '' directories < <(find terraform -name versions.tf -not -path '*/_shared/*' -printf '%h\0')

          # plugin cache は並行書き込みに対応していないため、init は直列で実行する
          for directory in "${directories[@]}"; do
            terraform -chdir="$directory" init -backend=false >/dev/null
          done

          printf '%s\0' "${directories[@]}" |
            xargs -0 -n 1 -P "$(nproc)" bash -c '
              if output="$(terraform -chdir="$1" validate 2>&1)"; then
                echo "ok: $1"
              else
                printf "failed: %s\n%s\n" "$1" "$output"
                exit 1
              fi
            ' _
