name: Drift Detection

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  group: drift-detection
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKLOAD_IDENTITY_PROVIDER: "projects/107577467292/locations/global/workloadIdentityPools/dotto/providers/github"
  SERVICE_ACCOUNT: "terraform-ci@swift2023groupc.iam.gserviceaccount.com"

jobs:
  projects:
    name: List projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read digger.yml
        id: list
        run: |
          echo "matrix=$(yq -o=json -I=0 '[.projects[] | {"name": .name, "dir": .dir}]' digger.yml)" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan (${{ matrix.project.name }})
    needs: projects
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.projects.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          service_account: ${{ env.SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}

      # terraform の終了コードをそのまま判定するため wrapper を無効にする。バージョンは apply を行う Digger に揃える
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - name: terraform plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_github_app_id: ${{ vars.DOTTO_GITHUB_MANAGER_APP_CLIENT_ID }}
          TF_VAR_github_app_installation_id: ${{ vars.DOTTO_GITHUB_MANAGER_APP_INSTALLATION_ID }}
          TF_VAR_github_app_pem_file: ${{ secrets.DOTTO_GITHUB_MANAGER_APP_PRIVATE_KEY }}
          TF_VAR_github_identity_provider_client_secret: ${{ secrets.CLOUDFLARE_GITHUB_IDP_CLIENT_SECRET }}
          PROJECT_NAME: ${{ matrix.project.name }}
          PROJECT_DIR: ${{ matrix.project.dir }}
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          result_file="$RUNNER_TEMP/result/$PROJECT_NAME"
          plan_file="$RUNNER_TEMP/plan.txt"

          if ! terraform -chdir="$PROJECT_DIR" init -no-color > /dev/null; then
            echo error > "$result_file"
            exit 1
          fi

          # 公開リポジトリのログに plan の全文を残さないよう、標準出力はファイルに退避して集計行だけ出す
          status=0
          terraform -chdir="$PROJECT_DIR" plan -lock=false -detailed-exitcode -no-color > "$plan_file" || status=$?

          case "$status" in
            0)
              echo clean > "$result_file"
              ;;
            2)
              echo drift > "$result_file"
              echo "::warning::$PROJECT_NAME: $(grep -m1 -E '^(Plan:|Changes to Outputs:)' "$plan_file" || echo '差分あり')"
              ;;
            *)
              echo error > "$result_file"
              exit 1
              ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: result-${{ matrix.project.name }}
          path: ${{ runner.temp }}/result/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Report
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
          pattern: result-*
          merge-multiple: true

      - name: Update drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: Terraform のドリフトを検知しました
          LABEL: drift
        run: |
          drift=""
          errors=""

          # 結果が無い project は、途中で落ちたものとしてエラーに数える
          while IFS= read -r project; do
            case "$(cat "results/$project" 2> /dev/null)" in
              clean) ;;
              drift) drift+="- \`$project\`"$'\n' ;;
              *) errors+="- \`$project\`"$'\n' ;;
            esac
          done < <(yq '.projects[].name' digger.yml)

          issue="$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')"

          if [[ -z "$drift" && -z "$errors" ]]; then
            echo "差分なし" >> "$GITHUB_STEP_SUMMARY"
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --comment "全 project で差分がなくなったため閉じます。 $RUN_URL"
            fi
            exit 0
          fi

          sections=""
          if [[ -n "$drift" ]]; then
            sections+=$'## 差分あり\n\n'"$drift"$'\n'
          fi
          if [[ -n "$errors" ]]; then
            sections+=$'## plan 失敗\n\n'"$errors"$'\n'
          fi
          sections+="対応手順は docs/digger.md の「ドリフト検知」を参照してください。"
          body="$sections"$'\n\n'"最終実行: $RUN_URL"

          echo "$sections" >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "$issue" ]]; then
            gh label create "$LABEL" --force --color d93f0b --description "Terraform のドリフト検知"
            gh issue create --title "$ISSUE_TITLE" --label "$LABEL" --body "$body"
            exit 0
          fi

          # 毎回コメントすると通知が埋もれるため、対象が変わったときだけコメントする
          previous="$(gh issue view "$issue" --json body --jq '.body' | sed '$d' | sed '$d')"
          gh issue edit "$issue" --body "$body"
          if [[ "$previous" != "$sections" ]]; then
            gh issue comment "$issue" --body "検知結果が変わりました。"$'\n\n'"$body"
          fi
