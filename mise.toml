[settings]
minimum_release_age = "24h"

[plugins]
gcloud = "https://github.com/jdx/vfox-gcloud.git#8bc2e33aa741c0935f219e0d5791f0dc92569ed9"

[tools]
bun = "1.4.4"
gcloud = "591.0.0"
"npm:rulesync" = "43.4.0"
terraform = "1.17.1"

[tasks.bootstrap]
run = [{ task = "rulesync" }, "bun install"]

[tasks.rulesync]
run = "rulesync generate"
